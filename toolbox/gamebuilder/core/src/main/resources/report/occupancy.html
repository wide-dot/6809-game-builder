<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Occupation — __TARGET__</title>
<style>
:root {
  --bg: #12151a; --panel: #191d24; --ink: #d6dae2; --dim: #8a92a0;
  --rule: #2a303a; --hover: #222834; --accent: #5cc8ff; --danger: #ff4d4d;
  --free: #1d222b;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #23272e; --dim: #6b7280;
    --rule: #d9dde3; --hover: #eef1f5; --accent: #0077cc; --danger: #d92626;
    --free: #e8eaee;
  }
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, sans-serif;
  display: flex; flex-direction: column;
}
code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }

header {
  display: flex; align-items: baseline; gap: 18px;
  padding: 10px 16px; border-bottom: 1px solid var(--rule);
  background: var(--panel);
}
header h1 { font-size: 15px; font-weight: 600; }
header h1 span { color: var(--dim); font-weight: 400; }
nav { display: flex; gap: 4px; }
nav button {
  background: none; border: 1px solid transparent; border-radius: 6px;
  color: var(--dim); font: inherit; padding: 4px 14px; cursor: pointer;
}
nav button.on { color: var(--ink); border-color: var(--rule); background: var(--bg); }
header .stats { margin-left: auto; color: var(--dim); font-size: 12px; }

main { flex: 1; display: flex; min-height: 0; }
aside {
  width: 320px; flex: none; overflow-y: auto;
  border-right: 1px solid var(--rule); background: var(--panel);
  padding: 10px 0 30px;
}
section.view { flex: 1; overflow: auto; padding: 18px 22px 60px; }

.grouphead {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px; cursor: pointer; user-select: none;
  color: var(--ink); font-weight: 600; font-size: 13px;
}
.grouphead:hover { background: var(--hover); }
.grouphead .n { color: var(--dim); font-weight: 400; font-size: 11px; margin-left: auto; }
.grouphead .arrow { color: var(--dim); font-size: 10px; width: 10px; }
.item {
  display: flex; align-items: center; gap: 7px;
  padding: 2px 12px 2px 28px; cursor: pointer; user-select: none;
}
.item:hover { background: var(--hover); }
.item .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sz { color: var(--dim); font-size: 11px; }
.item input { accent-color: var(--accent); }
.item.sel { background: var(--hover); box-shadow: inset 2px 0 0 var(--accent); }
.sidetitle {
  padding: 14px 12px 4px; color: var(--dim); font-size: 11px;
  text-transform: uppercase; letter-spacing: .08em;
}
select.state {
  display: block; width: calc(100% - 24px); margin: 6px 0 2px;
  background: var(--panel); color: var(--ink); border: 1px solid var(--rule);
  border-radius: 4px; padding: 4px 6px; font: inherit; font-size: 12px;
  text-transform: none; letter-spacing: 0;
}
.nodest .item { cursor: default; padding-left: 12px; }
.nodest .item:hover { background: none; }

.viewhead { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.viewhead select {
  background: var(--panel); color: var(--ink); border: 1px solid var(--rule);
  border-radius: 6px; padding: 4px 8px; font: inherit;
}
.viewhead .hint { color: var(--dim); font-size: 12px; }
.collisions {
  border: 1px solid var(--danger); border-radius: 8px;
  padding: 8px 12px; margin-bottom: 14px; font-size: 13px;
  display: none; max-height: 180px; overflow-y: auto;
}
.collisions.on { display: block; }
.collisions b { color: var(--danger); }
.collisions div { margin-top: 2px; }

svg { display: block; }
svg text { fill: var(--dim); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
.pagebar { fill: var(--free); }
.blk { stroke: rgba(0,0,0,.35); stroke-width: .5; }
.blk.hl { stroke: var(--accent); stroke-width: 1.5; }
.resv { opacity: .8; }
.clash { fill: var(--danger); opacity: .85; }
.cell { stroke: var(--bg); stroke-width: .6; }
.cell.hl { stroke: var(--accent); stroke-width: 1.4; }

/* head path */
.params { padding: 4px 12px 8px; display: grid; grid-template-columns: 1fr 64px; gap: 3px 8px; font-size: 12px; align-items: center; }
.params label { color: var(--dim); }
.params input {
  width: 64px; background: var(--bg); color: var(--ink); border: 1px solid var(--rule);
  border-radius: 4px; padding: 2px 5px; font: inherit; font-size: 12px; text-align: right;
}
.hop { display: flex; align-items: baseline; gap: 8px; padding: 3px 12px; cursor: pointer; user-select: none; }
.hop:hover { background: var(--hover); }
.hop.sel { background: var(--hover); box-shadow: inset 2px 0 0 var(--accent); }
.hop .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hop .t { color: var(--dim); font-size: 11px; }
.totals { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; font-size: 12px; color: var(--dim); }
.totals b { color: var(--ink); font-size: 15px; font-weight: 600; margin-right: 4px; }
table.steps { border-collapse: collapse; font-size: 12px; margin-top: 18px; }
table.steps th, table.steps td { padding: 2px 9px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
table.steps th { color: var(--dim); font-weight: 500; position: sticky; top: 0; background: var(--bg); }
table.steps td.l, table.steps th.l { text-align: left; }
table.steps tr:hover td { background: var(--hover); }
table.steps tr.sel td { background: var(--hover); box-shadow: inset 2px 0 0 var(--accent); }
table.steps td.back { color: var(--danger); }
table.steps td.lost { color: var(--danger); }
table.steps td.dim { color: var(--dim); }
.kind { display: inline-block; min-width: 40px; padding: 0 5px; border-radius: 3px; font-size: 11px; text-align: center; color: #fff; }

#tip {
  position: fixed; pointer-events: none; z-index: 10; display: none;
  background: var(--panel); color: var(--ink); border: 1px solid var(--rule);
  border-radius: 6px; padding: 5px 9px; font-size: 12px; max-width: 340px;
  box-shadow: 0 4px 14px rgba(0,0,0,.35);
}
#tip .mono { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Occupation <span>— cible __TARGET__</span></h1>
  <nav>
    <button id="tab-ram" class="on">RAM</button>
    <button id="tab-media">Média</button>
    <button id="tab-path">Parcours</button>
  </nav>
  <div class="stats" id="stats"></div>
</header>
<main>
  <aside id="side"></aside>
  <section class="view" id="view"></section>
</main>
<div id="tip"></div>
<script>
"use strict";
const DATA = /*__DATA__*/null;

/* ---------------------------------------------------------------- helpers */
const $ = (t, attrs, parent) => {
  const e = document.createElement(t);
  for (const k in attrs || {}) {
    if (k === "text") e.textContent = attrs[k];
    else if (k === "class") e.className = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  if (parent) parent.appendChild(e);
  return e;
};
const S = (t, attrs, parent) => {
  const e = document.createElementNS("http://www.w3.org/2000/svg", t);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const hex = (v, w) => "$" + v.toString(16).toUpperCase().padStart(w || 4, "0");
const kb = v => v >= 1024 ? (v / 1024).toFixed(v % 1024 ? 1 : 0) + " Ko" : v + " o";
/* a stable hue per name : the same element keeps its colour across builds */
function hue(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return h % 360;
}
const color = name => `hsl(${hue(name)} 55% 52%)`;
const tip = document.getElementById("tip");
function showTip(evt, html) {
  tip.innerHTML = html;
  tip.style.display = "block";
  const x = Math.min(evt.clientX + 14, innerWidth - tip.offsetWidth - 8);
  const y = Math.min(evt.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
function hideTip() { tip.style.display = "none"; }

const side = document.getElementById("side");
const view = document.getElementById("view");
const stats = document.getElementById("stats");

/* -------------------------------------------------------------- RAM view */
/* every checkable element, flat : scene loads and reserved ranges */
const ramItems = [];
/* An element carries the address it is REACHED at — the one the code uses —
   and the physical pieces it OCCUPIES. The two are not the same number : a
   page seen through the resident window shows its second half first, so a
   screen loaded at $7C00 fills the end of its page and comes back to the
   start. The map draws the pieces ; the labels show the address. */
DATA.ram.scenes.forEach(sc => sc.loads.forEach(l => ramItems.push({
  kind: "load", group: sc.name, name: l.name, container: l.container,
  page: l.page, address: l.address, size: l.size, window: l.window,
  pieces: l.pieces || [], unplaced: l.unplaced, checked: false
})));
DATA.ram.reserved.forEach(r => ramItems.push({
  kind: "reserved", group: "machine", name: r.name,
  page: r.page, address: r.address, size: r.size, window: r.window,
  pieces: r.pieces || [], unplaced: r.unplaced, checked: false
}));

/* the tree re-renders on every check : keep what the user opened, and where
   the panel was scrolled, or every click folds the tree back */
const openGroups = new Set();

/* The declared RAM state being looked at, null for "everything declared".
   A composition is what the machine really holds at one time — a scene alone
   is only a part of it — so picking one checks exactly its elements and lists
   nothing else. Unchecking from there is how you look underneath. */
const compositions = DATA.ram.compositions || [];
/* One picks a COMPOSITION, never a scene : a scene is a list of loads, an
   état de RAM is what the machine holds. When the configuration declares
   none, the tree falls back to the scenes — the old view, for a build that
   has not said what is resident together. */
let ramState = compositions.length ? compositions[0].name : null;

function compositionOf(name) {
  return compositions.find(c => c.name === name) || null;
}

function applyState(name) {
  ramState = name;
  const c = compositionOf(name);
  ramItems.forEach(i => {
    i.checked = c ? (i.kind === "load" && c.scenes.indexOf(i.group) >= 0) : false;
  });
  if (c) {
    c.scenes.forEach(sc => openGroups.add(sc));
  }
  render();
}

function stateSelector() {
  if (!compositions.length) {
    return;
  }
  const box = $("div", { class: "sidetitle" }, side);
  $("span", { text: "état de RAM" }, box);
  const sel = $("select", { class: "state" }, box);
  compositions.forEach(c => {
    const opt = $("option", { value: c.name, text: c.name }, sel);
    if (c.name === ramState) {
      opt.selected = true;
    }
  });
  sel.addEventListener("change", () => applyState(sel.value));
  const c = compositionOf(ramState);
  if (c) {
    $("span", { class: "n", text: c.scenes.length + " scène" + (c.scenes.length > 1 ? "s" : "") },
      box);
  }
}

function ramSide() {
  const scroll = side.scrollTop;
  side.innerHTML = "";
  stateSelector();
  const state = compositionOf(ramState);
  $("div", { class: "sidetitle",
             text: state ? "éléments de l'état — décocher pour regarder dessous"
                         : "éléments — cocher pour afficher" }, side);
  const groups = [...new Set(ramItems.map(i => i.group))]
      .filter(g => !state || state.scenes.indexOf(g) >= 0 || g === "machine");
  groups.forEach(g => {
    const items = ramItems.filter(i => i.group === g);
    const det = $("details", openGroups.has(g) ? { open: "" } : {}, side);
    det.addEventListener("toggle", () => {
      det.open ? openGroups.add(g) : openGroups.delete(g);
    });
    const sum = $("summary", { class: "grouphead" }, det);
    sum.style.listStyle = "none";
    $("span", { class: "arrow", text: "▸" }, sum);
    const gcb = $("input", { type: "checkbox" }, sum);
    $("span", { text: g }, sum);
    $("span", { class: "n", text: items.length + " · " + kb(items.reduce((a, i) => a + i.size, 0)) }, sum);
    gcb.addEventListener("click", e => {
      e.preventDefault(); e.stopPropagation();
      const on = !items.every(i => i.checked);
      items.forEach(i => i.checked = on);
      render();
    });
    const sync = () => {
      gcb.checked = items.every(i => i.checked);
      gcb.indeterminate = !gcb.checked && items.some(i => i.checked);
    };
    sync();
    items.forEach(i => {
      const row = $("div", { class: "item" }, det);
      const cb = $("input", { type: "checkbox" }, row);
      cb.checked = i.checked;
      $("span", { class: "sw" }, row).style.background = color(i.name);
      $("span", { class: "nm", text: i.name, title: i.name }, row);
      $("span", { class: "sz mono", text: kb(i.size) }, row);
      row.addEventListener("click", e => {
        if (e.target !== cb) cb.checked = !cb.checked;
        i.checked = cb.checked;
        render();
      });
      row.addEventListener("mouseenter", () => hover(i, true));
      row.addEventListener("mouseleave", () => hover(i, false));
    });
  });

  if (DATA.ram.noDest.length) {
    $("div", { class: "sidetitle", text: "sans destination RAM" }, side);
    const box = $("div", { class: "nodest" }, side);
    DATA.ram.noDest.forEach(f => {
      const row = $("div", { class: "item" }, box);
      $("span", { class: "sw" }, row).style.background = "var(--rule)";
      $("span", { class: "nm", text: f.name, title: f.name }, row);
      $("span", { class: "sz mono", text: kb(f.size) }, row);
    });
  }
  side.scrollTop = scroll;
}

let hoverName = null;
function hover(item, on) {
  hoverName = on ? item.name : null;
  document.querySelectorAll(".blk").forEach(b => {
    b.classList.toggle("hl", on && b.dataset.name === item.name);
  });
}

function ramView() {
  view.innerHTML = "";
  const head = $("div", { class: "viewhead" }, view);
  const checked = ramItems.filter(i => i.checked);
  $("span", { class: "hint", text: DATA.ram.pages + " pages de " + kb(DATA.ram.pageSize)
      + (checked.length ? "" : " — rien n'est affiché tant que rien n'est coché") }, head);

  const collBox = $("div", { class: "collisions" }, view);

  /* collisions among the CHECKED elements only. Two scenes loading the SAME
     file at the SAME destination write the same bytes : that is a reload,
     not a collision, and boot legitimately preloads what stage1 declares */
  const clashes = [];
  for (let a = 0; a < checked.length; a++) {
    for (let b = a + 1; b < checked.length; b++) {
      const i = checked[a], j = checked[b];
      if (i.name === j.name && i.address === j.address && i.size === j.size) continue;
      i.pieces.forEach(x => j.pieces.forEach(y => {
        if (x.page !== y.page) return;
        const lo = Math.max(x.offset, y.offset);
        const hi = Math.min(x.offset + x.size, y.offset + y.size);
        if (lo < hi) clashes.push({ page: x.page, lo, hi, a: i, b: j });
      }));
    }
  }
  if (clashes.length) {
    collBox.classList.add("on");
    collBox.innerHTML = "<b>" + clashes.length + " collision" + (clashes.length > 1 ? "s" : "") + "</b>";
    clashes.forEach(c => {
      const d = $("div", {}, collBox);
      d.innerHTML = "page <code>" + hex(c.page, 2) + "</code> " +
        "<code>+" + hex(c.lo) + "–" + hex(c.hi - 1) + "</code> (" + kb(c.hi - c.lo) + ") : " +
        c.a.name + " <i>(" + c.a.group + ")</i> ↔ " + c.b.name + " <i>(" + c.b.group + ")</i>";
    });
  }

  /* the map : one row per page, at the machine's real capacity. The bar
     takes the room the window offers, so the free column stays in sight */
  const LABEL = 64, FREE = 106, ROW = 26, GAP = 7, PAD = 4;
  const W = Math.max(420, view.clientWidth - LABEL - FREE - 60);
  const pages = DATA.ram.pages;
  const svg = S("svg", { width: LABEL + W + FREE + 10, height: pages * (ROW + GAP) + 20 }, view);
  const px = v => v * W / DATA.ram.pageSize;

  /* A row is a PAGE, drawn from its first byte : there is no per-page origin
     any more. The rows used to start wherever the smallest declared address
     fell, which is how a "page 1" came to start at $4000 and overflow its
     16 KB — it was mixing addresses from windows showing different pages. */

  /* free bytes per page : capacity minus the UNION of the checked pieces —
     a sum would count a collision twice and report negative room */
  const freeOf = p => {
    const spans = [];
    checked.forEach(i => i.pieces.forEach(x => {
      if (x.page === p) spans.push([x.offset, x.offset + x.size]);
    }));
    spans.sort((a, b) => a[0] - b[0]);
    let used = 0, end = -1;
    spans.forEach(([lo, hi]) => {
      if (lo > end) { used += hi - lo; end = hi; }
      else if (hi > end) { used += hi - end; end = hi; }
    });
    return DATA.ram.pageSize - used;
  };

  for (let p = 0; p < pages; p++) {
    const y = p * (ROW + GAP) + 10;
    S("text", { x: LABEL - 10, y: y + ROW / 2 - 1, "text-anchor": "end" }, svg)
      .textContent = hex(p, 2);
    S("rect", { class: "pagebar", x: LABEL, y, width: W, height: ROW, rx: 3 }, svg);
    const free = freeOf(p);
    const t = S("text", { x: LABEL + W + FREE, y: y + ROW / 2 + 4, "text-anchor": "end" }, svg);
    t.textContent = free === DATA.ram.pageSize ? kb(free) : kb(free) + " libres";
    if (free < DATA.ram.pageSize) t.style.fill = "var(--ink)";
  }

  checked.forEach(i => i.pieces.forEach((piece, n) => {
    if (piece.page >= pages) return;
    const y = piece.page * (ROW + GAP) + 10;
    const w = Math.max(px(piece.size), 1.5);
    const r = S("rect", {
      class: "blk" + (i.kind === "reserved" ? " resv" : ""),
      x: LABEL + px(piece.offset), y: y + PAD,
      width: w, height: ROW - PAD * 2, rx: 2
    }, svg);
    r.dataset.name = i.name;
    r.style.fill = i.kind === "reserved" ? "var(--dim)" : color(i.name);
    r.addEventListener("mousemove", e => showTip(e,
      "<b>" + i.name + "</b>" + (i.container ? " · " + i.container : "") +
      "<br><span class='mono'>page " + hex(piece.page, 2) + " +" + hex(piece.offset) +
      "–" + hex(piece.offset + piece.size - 1) + " · " + kb(piece.size) + "</span>" +
      "<br><span class='mono'>vu en " + hex(i.address) +
      (i.window ? ", fenetre " + i.window : "") + "</span>" +
      (i.pieces.length > 1 ? "<br><span class='mono'>morceau " + (n + 1) + "/" +
        i.pieces.length + " : la place depasse la fin de la page et reprend a son debut</span>" : "")));
    r.addEventListener("mouseleave", hideTip);

    /* the name inside the bar, when it fits — shortened before dropped */
    const fit = Math.floor((w - 8) / 6.2);
    if (fit >= 4) {
      const label = i.name.length <= fit ? i.name : i.name.slice(0, fit - 1) + "…";
      const t = S("text", {
        x: LABEL + px(piece.offset) + w / 2, y: y + ROW / 2 + 4,
        "text-anchor": "middle", "pointer-events": "none"
      }, svg);
      t.textContent = label;
      t.style.fill = "#0c0e12";
      t.style.fontSize = "10.5px";
    }
  }));

  clashes.forEach(c => {
    const y = c.page * (ROW + GAP) + 10;
    const r = S("rect", {
      class: "clash", x: LABEL + px(c.lo), y: y + 1,
      width: Math.max(px(c.hi - c.lo), 2), height: ROW - 2, rx: 2
    }, svg);
    r.addEventListener("mousemove", e => showTip(e,
      "<b style='color:var(--danger)'>collision</b> " + c.a.name + " ↔ " + c.b.name +
      "<br><span class='mono'>page " + hex(c.page, 2) + " +" + hex(c.lo) + "–" + hex(c.hi - 1) +
      " · " + kb(c.hi - c.lo) + "</span>"));
    r.addEventListener("mouseleave", hideTip);
  });

  const total = checked.reduce((a, i) => a + i.size, 0);
  stats.textContent = checked.length
    ? checked.length + " éléments cochés · " + kb(total)
      + " / " + kb(pages * DATA.ram.pageSize)
      + (clashes.length ? " · " + clashes.length + " collision" + (clashes.length > 1 ? "s" : "") : "")
    : "rien de coché";
}

/* ------------------------------------------------------------ media view */
let mediaIdx = 0;
let mediaSel = new Set();

function mediaSide() {
  const scroll = side.scrollTop;
  side.innerHTML = "";
  const inst = DATA.media[mediaIdx];
  if (!inst) { $("div", { class: "sidetitle", text: "aucun média" }, side); return; }
  $("div", { class: "sidetitle", text: "contenu — cliquer pour surligner" }, side);
  const sections = [...new Set(inst.items.map(i => i.section))];
  sections.forEach(sec => {
    const items = inst.items.filter(i => i.section === sec)
      .slice().sort((a, b) => b.size - a.size);
    const det = $("details", { open: "" }, side);
    const sum = $("summary", { class: "grouphead" }, det);
    sum.style.listStyle = "none";
    $("span", { class: "arrow", text: "▸" }, sum);
    $("span", { class: "sw" }, sum).style.background = color(sec);
    $("span", { text: sec }, sum);
    $("span", { class: "n", text: items.length + " · " + kb(items.reduce((a, i) => a + i.size, 0)) }, sum);
    items.forEach(i => {
      const key = i.section + "|" + i.name;
      const row = $("div", { class: "item" + (mediaSel.has(key) ? " sel" : "") }, det);
      $("span", { class: "sw" }, row).style.background = color(i.section);
      $("span", { class: "nm", text: i.name, title: i.name }, row);
      $("span", { class: "sz mono", text: kb(i.size) }, row);
      row.addEventListener("click", () => {
        mediaSel.has(key) ? mediaSel.delete(key) : mediaSel.add(key);
        render();
      });
    });
  });
  side.scrollTop = scroll;
}

function mediaView() {
  view.innerHTML = "";
  const head = $("div", { class: "viewhead" }, view);
  const sel = $("select", {}, head);
  DATA.media.forEach((m, i) => {
    const o = $("option", { value: i, text: m.name }, sel);
    if (i === mediaIdx) o.selected = true;
  });
  sel.addEventListener("change", () => { mediaIdx = +sel.value; mediaSel.clear(); render(); });

  const inst = DATA.media[mediaIdx];
  if (!inst) { stats.textContent = ""; return; }

  const used = inst.items.reduce((a, i) => a + i.size, 0);
  $("span", { class: "hint", text: inst.faces + " faces · " + inst.tracks + " pistes · "
      + inst.sectors + " secteurs de " + inst.sectorSize + " o — "
      + kb(used) + " / " + kb(inst.capacity)
      + " (" + Math.round(used * 100 / inst.capacity) + " %)" }, head);
  stats.textContent = inst.name + " · " + kb(used) + " / " + kb(inst.capacity);

  /* owner of every sector : who wrote its bytes (at most one, double writes
     are refused at build time — partial sectors may host two, keep the list) */
  const secOwners = new Map();
  inst.items.forEach(i => {
    const key = i.section + "|" + i.name;
    i.pieces.forEach(([start, len]) => {
      const first = Math.floor(start / inst.sectorSize);
      const last = Math.floor((start + len - 1) / inst.sectorSize);
      for (let s = first; s <= last; s++) {
        if (!secOwners.has(s)) secOwners.set(s, []);
        const owners = secOwners.get(s);
        if (!owners.some(o => o.key === key)) owners.push({ key, item: i });
      }
    });
  });

  /* one grid per face : tracks as rows, sectors as columns */
  const CELL = 11, GAPC = 1, LABEL = 40, TITLE = 22;
  const gridW = inst.sectors * (CELL + GAPC);
  const wrap = $("div", {}, view);
  wrap.style.display = "flex";
  wrap.style.gap = "36px";
  wrap.style.flexWrap = "wrap";

  for (let f = 0; f < inst.faces; f++) {
    const svg = S("svg", {
      width: LABEL + gridW + 6,
      height: TITLE + inst.tracks * (CELL + GAPC) + 8
    }, wrap);
    S("text", { x: LABEL, y: 13 }, svg).textContent = "face " + f;
    for (let t = 0; t < inst.tracks; t++) {
      if (t % 10 === 0) {
        S("text", { x: LABEL - 8, y: TITLE + t * (CELL + GAPC) + CELL - 2, "text-anchor": "end" }, svg)
          .textContent = t;
      }
      for (let s = 0; s < inst.sectors; s++) {
        const linear = (f * inst.tracks + t) * inst.sectors + s;
        const owners = secOwners.get(linear);
        const rect = S("rect", {
          class: "cell", x: LABEL + s * (CELL + GAPC), y: TITLE + t * (CELL + GAPC),
          width: CELL, height: CELL, rx: 1.5
        }, svg);
        if (!owners) {
          rect.style.fill = "var(--free)";
          continue;
        }
        const hl = owners.some(o => mediaSel.has(o.key));
        rect.style.fill = color(owners[0].item.section);
        if (mediaSel.size && !hl) rect.style.opacity = ".25";
        if (hl) rect.classList.add("hl");
        rect.addEventListener("mousemove", e => showTip(e,
          owners.map(o => "<b>" + o.item.name + "</b> · " + o.item.section).join("<br>") +
          "<br><span class='mono'>face " + f + " · piste " + t + " · secteur " + (s + 1) + "</span>"));
        rect.addEventListener("mouseleave", hideTip);
      }
    }
  }
}

/* ------------------------------------------------------------ head path */
/* The same walk and the same model as report/HeadPath.java (the reference) :
   the loader converges scene by scene — directory, table, the files' data,
   their link data — and the drive pays seeks and rotation for every sector.
   Kept in step with the Java by hand ; the text seek report is the check. */
const PATH = DATA.path || { disks: [], scenes: {}, chain: [], defaults: {} };
const KIND = { dir: "répertoire", table: "table", data: "données", link: "liens", other: "autre" };
const KINDCOL = { dir: "#c47a1a", table: "#7c5cd6", data: "#2e8bd9", link: "#2aa876", other: "#888" };
let pathDisk = 0;
let pathSel = 0;            /* selected hop in the chain */
let pathFrom = null;        /* override of the hop's origin state, or null */
let pathStep = -1;          /* highlighted step */
const params = Object.assign({ step: 4, settle: 25, overhead: 1, rpm: 300, frac: 0.8 }, PATH.defaults);

function slotOf(disk, track, k) {
  if (!disk.readOrder) return k % disk.sectors;
  const skew = disk.skewByTrack[track % disk.skewByTrack.length];
  const number = disk.readOrder[(skew + k) % disk.sectors];
  return disk.slotOfNumber[number - 1];
}

function newState() { return { headTrack: 0, currentDir: null, cachedTable: null, ptsec: null, timeMs: 0 }; }
function cloneState(st) { return Object.assign({}, st); }

function simulate(disk, from, to, st) {
  const r = { steps: [], seekMs: 0, waitMs: 0, readMs: 0, seeks: 0, tracks: 0, sectors: 0, cached: 0, lost: 0, elsewhere: 0 };
  const slotMs = 60000 / params.rpm / disk.sectors;
  const perFace = disk.tracks * disk.sectors;

  function read(kind, key, name) {
    const el = disk.elements[key];
    if (!el) {
      if (kind === "data" || kind === "link") return;
      r.steps.push({ kind, name, elsewhere: true, sectors: 0, cached: 0, seekMs: 0, waitMs: 0, readMs: 0, lin: [] });
      r.elsewhere++;
      return;
    }
    const s = { kind, name, elsewhere: false, sectors: 0, cached: 0, seeks: 0, tracks: 0,
      seekMs: 0, waitMs: 0, readMs: 0, startMs: st.timeMs, lost: 0, lin: [], face: 0, track: 0, sector: 0, lastTrack: 0 };
    const n = el.sectors.length;
    el.sectors.forEach((lin, idx) => {
      const face = Math.floor(lin / perFace);
      const track = Math.floor((lin % perFace) / disk.sectors);
      const k = lin % disk.sectors;
      if (idx === 0) { s.face = face; s.track = track; s.sector = k; }
      s.lastTrack = track;
      s.lin.push(lin);
      const partial = (idx === 0 && el.pf) || (idx === n - 1 && el.pl);
      if (partial && st.ptsec === lin) { s.cached++; return; }
      let sought = false;
      if (track !== st.headTrack) {
        const d = Math.abs(track - st.headTrack);
        s.seeks++; s.tracks += d;
        const ms = d * params.step + params.settle;
        s.seekMs += ms; st.timeMs += ms; st.headTrack = track;
        sought = true;
      }
      /* a long wait right after a seek is latency ; on a head that did not
         move it is a turn lost, the slot went by before the loader asked */
      const angle = (st.timeMs / slotMs) % disk.sectors;
      let wait = ((slotOf(disk, track, k) - angle) % disk.sectors + disk.sectors) % disk.sectors;
      if (wait > disk.sectors - 0.001) wait = 0;
      const waitMs = wait * slotMs;
      if (!sought && wait > disk.sectors / 2) s.lost++;
      const readMs = slotMs * params.frac;
      s.waitMs += waitMs; s.readMs += readMs;
      st.timeMs += waitMs + readMs + params.overhead;
      s.sectors++;
      if (partial) st.ptsec = lin;
    });
    r.steps.push(s);
    r.seekMs += s.seekMs; r.waitMs += s.waitMs; r.readMs += s.readMs;
    r.seeks += s.seeks; r.tracks += s.tracks; r.sectors += s.sectors; r.cached += s.cached; r.lost += s.lost;
  }
  function dirLoad(dir) {
    if (dir < 0 || st.currentDir === dir) return;
    st.currentDir = dir;
    read("dir", "directory " + dir, "directory " + dir);
    st.ptsec = null;
  }
  const target = new Set(to), held = new Set(from);
  from.forEach(scene => {
    if (target.has(scene)) return;
    const load = PATH.scenes[scene]; if (!load) return;
    dirLoad(load.dir);
    if (st.cachedTable === scene) st.cachedTable = null; else read("table", scene, scene);
  });
  to.forEach(scene => {
    if (held.has(scene)) return;
    const load = PATH.scenes[scene]; if (!load) return;
    dirLoad(load.dir);
    read("table", scene, scene);
    st.cachedTable = scene;
    load.files.forEach(f => read("data", f, f));
    load.files.forEach(f => read("link", f + PATH.linkSuffix, f));
  });
  r.totalMs = r.seekMs + r.waitMs + r.readMs;
  return r;
}

/* the chain : every state from the previous one, drive state carried along ;
   returns per hop {from, to, result, before (state snapshot)} */
function runChain(disk) {
  const hops = [];
  let st = newState(), from = [], fromName = "(rien)";
  PATH.chain.forEach(c => {
    const before = cloneState(st);
    const result = simulate(disk, from, c.scenes, st);
    hops.push({ fromName, toName: c.name, from, to: c.scenes, result, before });
    from = c.scenes; fromName = c.name;
  });
  return hops;
}

function ms(v) { return v >= 1000 ? (v / 1000).toFixed(2) + " s" : Math.round(v) + " ms"; }

function pathSide() {
  const scroll = side.scrollTop;
  side.innerHTML = "";
  const disk = PATH.disks[pathDisk];
  if (!disk) { $("div", { class: "sidetitle", text: "aucun média" }, side); return; }

  $("div", { class: "sidetitle", text: "modèle mécanique" }, side);
  const box = $("div", { class: "params" }, side);
  [["step", "pas de piste (ms)"], ["settle", "stabilisation (ms)"], ["overhead", "entre deux secteurs (ms)"],
   ["rpm", "tours / minute"], ["frac", "créneau occupé (0-1)"]].forEach(([k, label]) => {
    $("label", { text: label }, box);
    const inp = $("input", { type: "number", step: k === "frac" ? "0.05" : "1", value: params[k] }, box);
    inp.addEventListener("change", () => { params[k] = +inp.value || 0; render(); });
  });
  $("div", { class: "params" }, side).innerHTML =
    "<span style='grid-column:1/3;color:var(--dim)'>entrelacement " + disk.softskip + ", skew " + disk.softskew
    + ", format " + disk.hardskip + " — " + (60000 / params.rpm / disk.sectors).toFixed(1) + " ms le créneau</span>";

  $("div", { class: "sidetitle", text: "enchaînement des états" }, side);
  const hops = runChain(disk);
  let total = 0;
  hops.forEach((h, i) => {
    total += h.result.totalMs;
    const row = $("div", { class: "hop" + (i === pathSel ? " sel" : "") }, side);
    $("span", { class: "nm", text: h.fromName + " → " + h.toName, title: h.fromName + " → " + h.toName }, row);
    $("span", { class: "t mono", text: ms(h.result.totalMs) }, row);
    row.addEventListener("click", () => { pathSel = i; pathFrom = null; pathStep = -1; render(); });
  });
  const tot = $("div", { class: "hop" }, side);
  tot.style.cursor = "default";
  $("span", { class: "nm", text: "toute la chaîne" }, tot);
  $("span", { class: "t mono", text: ms(total) }, tot);

  if (hops.length) {
    $("div", { class: "sidetitle", text: "ou depuis un autre état" }, side);
    const sel = $("select", { class: "state" }, side);
    $("option", { value: "", text: "(l'état précédent de la chaîne)" }, sel);
    $("option", { value: "(rien)", text: "(rien) — disquette froide" }, sel);
    PATH.chain.forEach(c => { const o = $("option", { value: c.name, text: c.name }, sel); if (pathFrom === c.name) o.selected = true; });
    if (pathFrom === "(rien)") sel.value = "(rien)";
    sel.addEventListener("change", () => { pathFrom = sel.value || null; pathStep = -1; render(); });
  }
  side.scrollTop = scroll;
}

/* the hop the view shows : the chain's, or the selected target from another origin */
function currentHop(disk) {
  const hops = runChain(disk);
  if (!hops.length) return null;
  const hop = hops[Math.min(pathSel, hops.length - 1)];
  if (!pathFrom) return hop;
  let st, from = [], fromName = pathFrom;
  if (pathFrom === "(rien)") { st = newState(); }
  else {
    const origin = hops.find(h => h.toName === pathFrom);
    if (!origin) return hop;
    st = cloneState(origin.before);
    simulate(disk, origin.from, origin.to, st);   /* the drive as that state left it */
    from = origin.to;
  }
  return { fromName, toName: hop.toName, from, to: hop.to, result: simulate(disk, from, hop.to, st) };
}

function pathView() {
  view.innerHTML = "";
  const head = $("div", { class: "viewhead" }, view);
  const sel = $("select", {}, head);
  PATH.disks.forEach((d, i) => { const o = $("option", { value: i, text: d.name }, sel); if (i === pathDisk) o.selected = true; });
  sel.addEventListener("change", () => { pathDisk = +sel.value; pathStep = -1; render(); });
  const disk = PATH.disks[pathDisk];
  if (!disk) { stats.textContent = ""; return; }
  const hop = currentHop(disk);
  if (!hop) { $("span", { class: "hint", text: "aucun état déclaré" }, head); stats.textContent = ""; return; }
  const r = hop.result;
  $("span", { class: "hint", text: hop.fromName + " → " + hop.toName + " : ce que la tête lit, dans l'ordre du loader" }, head);
  stats.textContent = hop.fromName + " → " + hop.toName + " · " + ms(r.totalMs);

  const tot = $("div", { class: "totals" }, view);
  const cell = (v, l) => { const c = $("span", {}, tot); $("b", { text: v }, c); c.append(l); };
  cell(ms(r.totalMs), "estimé");
  cell(ms(r.seekMs), r.seeks + " déplacement" + (r.seeks > 1 ? "s" : "") + ", " + r.tracks + " pistes");
  cell(ms(r.waitMs), "d'attente de rotation, " + r.lost + " tour" + (r.lost > 1 ? "s" : "") + " perdu" + (r.lost > 1 ? "s" : ""));
  cell(ms(r.readMs), "de lecture, " + r.sectors + " secteurs" + (r.cached ? " (+" + r.cached + " en cache)" : ""));
  if (r.elsewhere) cell(r.elsewhere, "lecture(s) sur une autre disquette");

  /* the disk, coloured by reading order */
  const order = new Map();   /* linear sector -> step index */
  r.steps.forEach((s, i) => s.lin.forEach(lin => { if (!order.has(lin)) order.set(lin, i); }));
  const nsteps = Math.max(1, r.steps.length);
  const CELL = 9, GAPC = 1, LABEL = 34, TITLE = 20;
  const gridW = disk.sectors * (CELL + GAPC);
  const wrap = $("div", {}, view);
  wrap.style.display = "flex"; wrap.style.gap = "28px"; wrap.style.flexWrap = "wrap";
  for (let f = 0; f < disk.faces; f++) {
    const svg = S("svg", { width: LABEL + gridW + 6, height: TITLE + disk.tracks * (CELL + GAPC) + 8 }, wrap);
    S("text", { x: LABEL, y: 12 }, svg).textContent = "face " + f;
    for (let t = 0; t < disk.tracks; t++) {
      if (t % 10 === 0) S("text", { x: LABEL - 6, y: TITLE + t * (CELL + GAPC) + CELL - 1, "text-anchor": "end" }, svg).textContent = t;
      for (let k = 0; k < disk.sectors; k++) {
        const lin = (f * disk.tracks + t) * disk.sectors + k;
        const rect = S("rect", { class: "cell", x: LABEL + k * (CELL + GAPC), y: TITLE + t * (CELL + GAPC), width: CELL, height: CELL, rx: 1.5 }, svg);
        const i = order.get(lin);
        if (i === undefined) { rect.style.fill = "var(--free)"; continue; }
        const st = r.steps[i];
        const hue = 210 - 190 * (i / nsteps);
        rect.style.fill = "hsl(" + hue + " 70% 50%)";
        if (pathStep >= 0 && pathStep !== i) rect.style.opacity = ".25";
        if (pathStep === i) rect.classList.add("hl");
        rect.addEventListener("mousemove", e => showTip(e, "<b>" + st.name + "</b> · " + KIND[st.kind]
          + "<br><span class='mono'>lecture n°" + (i + 1) + " · face " + f + " · piste " + t + " · secteur logique " + k
          + " · créneau " + slotOf(disk, t, k) + "</span>"));
        rect.addEventListener("mouseleave", hideTip);
        rect.addEventListener("click", () => { pathStep = pathStep === i ? -1 : i; render(); });
      }
    }
  }

  /* the steps */
  const table = $("table", { class: "steps" }, view);
  const thead = $("tr", {}, $("thead", {}, table));
  ["n°", "type", "élément", "face", "pistes", "secteur", "secteurs", "cache", "déplacement", "attente", "lecture", "total", "cumul"].forEach((h, i) =>
    $("th", { class: i < 3 ? "l" : "", text: h }, thead));
  const tbody = $("tbody", {}, table);
  let cum = 0, prevTrack = -1;
  r.steps.forEach((s, i) => {
    const tr = $("tr", { class: i === pathStep ? "sel" : "" }, tbody);
    $("td", { class: "l dim", text: i + 1 }, tr);
    const kt = $("td", { class: "l" }, tr);
    $("span", { class: "kind", text: KIND[s.kind] }, kt).style.background = KINDCOL[s.kind];
    $("td", { class: "l", text: s.name }, tr);
    if (s.elsewhere) {
      $("td", { class: "dim l", text: "sur une autre disquette", colspan: 10 }, tr);
      return;
    }
    const back = prevTrack >= 0 && s.track < prevTrack;
    const total = s.seekMs + s.waitMs + s.readMs;
    cum += total;
    $("td", { text: s.face }, tr);
    $("td", { class: back ? "back" : "", text: (back ? "← " : "") + (s.track === s.lastTrack ? s.track : s.track + "…" + s.lastTrack) }, tr);
    $("td", { text: s.sector }, tr);
    $("td", { text: s.sectors }, tr);
    $("td", { class: "dim", text: s.cached || "" }, tr);
    $("td", { class: s.seeks ? "" : "dim", text: s.seeks ? Math.round(s.seekMs) + " (" + s.tracks + " p)" : "" }, tr);
    $("td", { class: s.lost ? "lost" : "", text: Math.round(s.waitMs) + (s.lost ? " ⟳" + s.lost : "") }, tr);
    $("td", { text: Math.round(s.readMs) }, tr);
    $("td", { text: Math.round(total) }, tr);
    $("td", { class: "dim", text: ms(cum) }, tr);
    tr.addEventListener("click", () => { pathStep = pathStep === i ? -1 : i; render(); });
    prevTrack = s.lastTrack;
  });
}

/* ------------------------------------------------------------------ tabs */
let tab = "ram";
const bRam = document.getElementById("tab-ram");
const bMedia = document.getElementById("tab-media");
const bPath = document.getElementById("tab-path");
/* the page opens ON a state, checked : that is the memory the machine holds.
   applyState() renders, so the bootstrap render() below is only for the
   configurations that declare no composition. */
if (ramState) {
  applyState(ramState);
}
bRam.addEventListener("click", () => { tab = "ram"; render(); });
bMedia.addEventListener("click", () => { tab = "media"; render(); });
bPath.addEventListener("click", () => { tab = "path"; render(); });

function render() {
  bRam.classList.toggle("on", tab === "ram");
  bMedia.classList.toggle("on", tab === "media");
  bPath.classList.toggle("on", tab === "path");
  hideTip();
  if (tab === "ram") { ramSide(); ramView(); }
  else if (tab === "media") { mediaSide(); mediaView(); }
  else { pathSide(); pathView(); }
}
render();
addEventListener("resize", () => { if (tab === "ram") ramView(); });
</script>
